const KX_LS = "wf_ukridx_pw";
const kb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function kxDec(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:kb64(KX_ENC.salt),iterations:KX_ENC.iterations,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:kb64(KX_ENC.iv)}, key, kb64(KX_ENC.ciphertext));
  return new TextDecoder().decode(pt);
}
async function kxOpen(pw, remember){

    if(remember) localStorage.setItem(KX_LS, pw);

function kxGo(){ kxOpen(document.getElementById("kx-pw").value, true); }
